<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061b2d">
<title>آسيا V4</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#061b2d,#0b4261 58%,#087f92);color:#fff;min-height:100vh}
.app{max-width:520px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(18px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 4px 10px}
.brand{font-size:30px;font-weight:800}.status{font-size:13px;color:#bceff4;display:flex;gap:7px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:#4de3a3;box-shadow:0 0 12px #4de3a3}
.hero{text-align:center;padding:18px 12px 14px}.orb{width:104px;height:104px;margin:auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#c9ffff,#38c9dd 28%,#087e9e 58%,#042f4b);box-shadow:0 0 36px rgba(75,226,244,.42);font-size:45px;font-weight:800}
.hero h1{margin:15px 0 6px;font-size:25px}.hero p{margin:0;color:#cbe9ef;line-height:1.7;font-size:14px}
.chat{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:14px;backdrop-filter:blur(14px)}
.messages{min-height:300px;max-height:430px;overflow-y:auto;padding:4px 2px 10px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{max-width:86%;padding:11px 13px;border-radius:17px;line-height:1.6;font-size:15px;word-wrap:break-word}
.bot{align-self:flex-start;background:rgba(255,255,255,.14);border-bottom-left-radius:6px}
.user{align-self:flex-end;background:#0aa0b8;border-bottom-right-radius:6px}
.input{display:flex;gap:8px;align-items:center;background:#fff;border-radius:24px;padding:6px 7px 6px 10px;margin-top:8px}
.input input{border:0;outline:0;flex:1;font-size:16px;padding:10px 6px;background:transparent;text-align:right;min-width:0}
.send{width:44px;height:44px;border:0;border-radius:50%;font-size:19px;background:#0b9bb2;color:#fff}
.small{font-size:11px;color:#b9dce3;text-align:center;padding:14px 0}
.loading{opacity:.75;font-style:italic}
</style>
</head>
<body>
<main class="app">
<header class="top">
  <div class="brand">آسيا</div>
  <div class="status"><span class="dot"></span> متصلة بالذكاء الاصطناعي</div>
</header>
<section class="hero">
  <div class="orb">آ</div>
  <h1>هلا حيدر، وياك آسيا</h1>
  <p>هسه هذا الإصدار مربوط فعلياً بـ OpenAI عن طريق Netlify Function.</p>
</section>
<section class="chat">
  <div class="messages" id="messages" aria-live="polite">
    <div class="msg bot">أهلًا حيدر 🌿 اسألني أي سؤال.</div>
  </div>
  <form class="input" id="chatForm">
    <input id="q" placeholder="اكتب لآسيا..." autocomplete="off">
    <button class="send" type="submit">➤</button>
  </form>
</section>
<div class="small">Asia V4 • OpenAI + Netlify</div>
</main>
<script>
(function(){
  const form = document.getElementById('chatForm');
  const input = document.getElementById('q');
  const messages = document.getElementById('messages');

  function addMessage(text, type, extra=''){
    const el = document.createElement('div');
    el.className = 'msg ' + type + (extra ? ' ' + extra : '');
    el.textContent = text;
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
    return el;
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    const text = input.value.trim();
    if(!text) return;
    addMessage(text,'user');
    input.value='';
    const loading = addMessage('آسيا دا تفكر...','bot','loading');

    try{
      const r = await fetch('/.netlify/functions/chat', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({message:text})
      });
      const data = await r.json();
      loading.remove();
      if(!r.ok) throw new Error(data.error || 'تعذر الاتصال');
      addMessage(data.reply || 'ما وصلني رد.','bot');
    }catch(err){
      loading.remove();
      addMessage('صار خطأ بالاتصال: ' + err.message,'bot');
    }
  });
})();
</script>
</body>
</html>
